name: Verify Windows KiCad library installer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup.ps1'
      - '.github/workflows/verify-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare KiCad 10 mock tables with stale entries
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MaxStriX324-KiCad-test'
          $config = Join-Path $root 'config\10.0'
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          $old = 'C:/old-missing-directory/MaxStriX324'
          [IO.File]::WriteAllText((Join-Path $config 'sym-lib-table'), '(sym_lib_table (lib (name "MaxStriX324")(type "KiCad")(uri "' + $old + '.kicad_sym")(options "")(descr "stale")))')
          [IO.File]::WriteAllText((Join-Path $config 'fp-lib-table'), '(fp_lib_table (lib (name "MaxStriX324")(type "KiCad")(uri "' + $old + '.pretty")(options "")(descr "stale")))')
      - name: Install, migrate stale paths, repeat and verify
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MaxStriX324-KiCad-test'
          $dir = Join-Path $root 'installed'
          $config = Join-Path $root 'config'
          foreach ($mode in @('Install','Install','Update','Check')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup.ps1 -Mode $mode -InstallDir $dir -ConfigRoot $config -NoUserEnv -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "Installer $mode failed ($LASTEXITCODE)" }
          }
          foreach ($table in @('sym-lib-table','fp-lib-table')) {
            $value = [IO.File]::ReadAllText((Join-Path $config ('10.0\' + $table)))
            if ([regex]::Matches($value, '\(name "MaxStriX324"\)').Count -ne 1) {
              throw "Incorrect library count in $table"
            }
            $relative = if ($table -eq 'fp-lib-table') { 'MaxStriX324.pretty' } else { 'MaxStriX324.kicad_sym' }
            $expected = [IO.Path]::GetFullPath((Join-Path $dir $relative)).Replace([char]92,[char]47)
            if (-not $value.Contains('(uri "' + $expected + '")')) {
              throw "Incorrect library path in $table"
            }
          }
          if (-not (Test-Path (Join-Path $dir 'MaxStriX324.pretty\EC3503_16P_THT.kicad_mod'))) { throw 'Missing EC3503 footprint' }
          if (-not (Test-Path (Join-Path $dir 'MaxStriX324.pretty\UCC21750_SOIC16W_P1.27mm.kicad_mod'))) { throw 'Missing UCC21750 footprint' }
          if (-not (Test-Path (Join-Path $root 'Update-MaxStriX324.bat'))) { throw 'Missing external updater' }
          Write-Host 'PASS: library entries now point to valid absolute paths'
